name: CA Buddy CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
      - name: Build application
        run: npm run build

  e2e:
    name: Browser acceptance
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build test bundle
        run: npm run build
        env:
          VITE_GOOGLE_API_KEY: playwright-test-key
          VITE_GOOGLE_MODEL: gemma-4-26b-a4b-it
      - name: Run browser acceptance tests
        run: npm run test:e2e

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_GOOGLE_API_KEY: "AQ.Ab8RN6KsY4-0ZsRsKtbXUfqJ6wrHolXlCuLLPYiFcTMj3LnUdw"
      VITE_GOOGLE_MODEL: gemma-4-26b-a4b-it
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verify production model configuration
        run: |
          if [[ -z "$VITE_GOOGLE_API_KEY" ]]; then
            echo "::error::The production Google API key is not configured."
            exit 1
          fi
      - name: Build production bundle
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
